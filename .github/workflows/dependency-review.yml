name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: New dependency vulnerabilities and licenses
    # Dependency review needs GitHub Advanced Security on a private repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-packages: pkg:npm/ag-grid-enterprise, pkg:npm/ag-charts-enterprise
          deny-groups: pkg:npm/@ag-grid-enterprise/

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: New dependency vulnerabilities and licenses
    # Dependency review needs GitHub Advanced Security on a private repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-packages: pkg:npm/ag-grid-enterprise, pkg:npm/ag-charts-enterprise
          deny-groups: pkg:npm/@ag-grid-enterprise/

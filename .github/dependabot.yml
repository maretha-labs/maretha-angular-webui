version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: chore
      include: scope
    # These packages publish a major for each Angular major and only install together,
    # so their majors arrive in one Angular upgrade instead of one pull request each.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-builders/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fortawesome/angular-fontawesome'
        update-types: ['version-update:semver-major']
      - dependency-name: '@ng-select/ng-select'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng2-charts'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ngx-bootstrap'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ngx-extended-pdf-viewer'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ngx-markdown'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ngx-translate-cut'
        update-types: ['version-update:semver-major']
      # three follows the range @google/model-viewer accepts, and katex the range ngx-markdown
      # accepts: a newer version does not install. They move together with those packages.
      - dependency-name: 'three'
      - dependency-name: '@types/three'
      - dependency-name: 'katex'
        versions: ['>=0.19.0']
      # karma-jasmine runs jasmine-core 4, and the typings describe the Jasmine that runs.
      - dependency-name: 'jasmine-core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jasmine'
        update-types: ['version-update:semver-major']
      # A Prettier release can reformat files; it is taken on its own with the reformatting.
      - dependency-name: 'prettier'
      # axe 4.14 reports label-content-name-mismatch on tree items with children; the scanner
      # moves once the trees are reviewed against it.
      - dependency-name: '@axe-core/playwright'
        versions: ['>=4.14.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

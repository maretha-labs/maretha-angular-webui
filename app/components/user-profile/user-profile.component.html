<div class="modal-header">
	<h4 class="modal-title pull-left">
		{{ 'app.components.user-profile.user-profile-e887dd' | webuiMessage: 'User profile' }}
	</h4>

	<button
		type="button"
		class="close btn-close pull-right"
		[attr.aria-label]="'app.components.user-profile.close-835585' | webuiMessage: 'Close'"
		(click)="close()"
	>
		<span aria-hidden="true" class="visually-hidden">&times;</span>
	</button>
</div>

@if (editorForm) {
	<div class="modal-body" [formGroup]="editorForm">
		<div class="row">
			<div class="col-12">
				<input
					class="form-control py-3 mb-3"
					type="text"
					[value]="userInfo?.id"
					[attr.aria-label]="userInfo?.id"
					disabled
					readonly
				/>
			</div>
			<div class="col-sm-6">
				<div class="form-floating required mb-3">
					<input
						type="text"
						class="form-control"
						id="firstName"
						[attr.placeholder]="
							'app.components.user-profile.first-name-8ddd99' | webuiMessage: 'First name'
						"
						formControlName="firstName"
					/>
					<label for="firstName">{{
						'app.components.user-profile.first-name-8ddd99' | webuiMessage: 'First name'
					}}</label>
				</div>
			</div>
			<div class="col-sm-6">
				<div class="form-floating required mb-3">
					<input
						type="text"
						class="form-control"
						id="lastName"
						[attr.placeholder]="
							'app.components.user-profile.last-name-1c6695' | webuiMessage: 'Last name'
						"
						formControlName="lastName"
					/>
					<label for="lastName">{{
						'app.components.user-profile.last-name-1c6695' | webuiMessage: 'Last name'
					}}</label>
				</div>
			</div>
			<div class="col-sm-6">
				<div class="form-floating required mb-3">
					<input
						type="email"
						class="form-control"
						id="email"
						[attr.placeholder]="
							'app.components.user-profile.email-address-6fabb7' | webuiMessage: 'Email address'
						"
						formControlName="email"
					/>
					<label for="email">{{
						'app.components.user-profile.email-address-6fabb7' | webuiMessage: 'Email address'
					}}</label>
				</div>
			</div>
			<div class="col-sm-6">
				<div class="form-floating mb-3">
					<input
						type="text"
						class="form-control"
						id="company"
						[attr.placeholder]="
							'app.components.user-profile.company-a5599d' | webuiMessage: 'Company'
						"
						formControlName="company"
					/>
					<label for="company">{{
						'app.components.user-profile.company-a5599d' | webuiMessage: 'Company'
					}}</label>
				</div>
			</div>
			<div class="col-sm-12">
				<button
					type="button"
					(click)="changePassword()"
					class="btn btn-outline-secondary w-100 py-3"
				>
					{{ 'userProfile.password.change' | webuiMessage: 'Change password' }}
				</button>
			</div>
		</div>
	</div>
}

<div class="modal-footer flex-nowrap p-0">
	<button
		(click)="close()"
		type="button"
		class="btn btn-lg btn-link fs-6 text-decoration-none col-6 m-0 rounded-0 border-end"
	>
		{{
			'app.components.user-profile.close-without-saving-939e73'
				| webuiMessage: 'Close without saving'
		}}
	</button>

	<button
		(click)="saveChanges()"
		type="button"
		[disabled]="editorForm?.pristine || editorForm?.invalid"
		class="btn btn-lg btn-link fs-6 text-decoration-none col-6 m-0 rounded-0"
	>
		<strong>{{
			'app.components.user-profile.save-changes-b75610' | webuiMessage: 'Save changes'
		}}</strong>
	</button>
</div>
